# Dependency updates. Weekly version bumps, grouped so each ecosystem
# directory opens at most one minor+patch PR a week; majors open one PR
# each so breaking upgrades are reviewed on their own. Security updates are
# not throttled by this schedule (enable "Dependabot security updates" in
# the repository settings).
version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mcp
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # Docusaurus packages must move in lockstep or the build breaks.
      docusaurus:
        patterns: ['@docusaurus/*']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      images:
        patterns: ['*']
