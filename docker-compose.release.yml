# Run Hoopoe from the prebuilt images published to GHCR by the Release
# workflow — no Node toolchain, no source build on the host:
#
#   ./install.sh                                        # writes .env (secrets)
#   docker compose -f docker-compose.release.yml up -d
#
# Pin a version by setting HOOPOE_VERSION=1.2.3 in .env (defaults to
# `latest`). Upgrade with:
#
#   docker compose -f docker-compose.release.yml pull
#   docker compose -f docker-compose.release.yml up -d
#
# The build-from-source path stays in docker-compose.yml (contributors, or
# anyone who prefers auditing and building locally). Service topology, env
# vars, and port bindings are kept identical between the two files — the
# frontend's nginx proxies /api/ to the service named `backend`, so the
# names must not diverge.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      # Postgres stays bound to localhost only — the backend talks to it over
      # the compose network, never via the host. If you don't want it on the
      # host at all, comment this whole `ports` block out.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/gekkotron/hoopoe-backend:${HOOPOE_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env (openssl rand -hex 32)}
      # Only while rotating SESSION_SECRET: the old value, for one boot.
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
      PORT: 3000
      # nginx (frontend container) is the only hop in front of the backend,
      # on the private compose network. Trusting it lets rate limits key on
      # the real browser address it sends in X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      # Set to false in .env once everyone has an account.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # Wall-clock features (bank-sync retrieval hour) follow this timezone;
      # containers default to UTC otherwise. Node honors TZ without tzdata.
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: LAN clients go through nginx on FRONTEND_PORT, which
      # proxies /api/* (MCP included). Publishing this on every interface
      # would let a LAN client skip nginx and forge X-Forwarded-For.
      - "127.0.0.1:${BACKEND_PORT:-8001}:3000"

  frontend:
    image: ghcr.io/gekkotron/hoopoe-frontend:${HOOPOE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Listens on all host interfaces so other devices on your LAN can reach
      # the app via http://<host-ip>:${FRONTEND_PORT}. Restrict with a host
      # firewall if needed. Container port is 8080 because the image runs
      # nginx as a non-root user (can't bind < 1024).
      - "${FRONTEND_PORT:-8000}:8080"
